services:
  - type: web
    name: valuation-tool-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: frankfurt
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
